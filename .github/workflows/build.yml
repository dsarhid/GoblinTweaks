name: Build

# Push / pull request: compile against the current Dalamud release.
# Tag "v*": also publish a GitHub release with latest.zip and refresh repo.json.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'repo.json']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.dalamud
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download Dalamud
        run: |
          curl -sSfL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          mkdir -p "$DALAMUD_HOME"
          unzip -q dalamud.zip -d "$DALAMUD_HOME"

      - name: Build
        run: dotnet build GoblinTweaks/GoblinTweaks.csproj -c Release

      - name: Collect package
        run: |
          zip=$(find GoblinTweaks/bin -name latest.zip | head -n 1)
          test -n "$zip" || { echo "latest.zip not found"; exit 1; }
          mkdir dist
          cp "$zip" dist/latest.zip
          cp "$(dirname "$zip")/GoblinTweaks.json" dist/GoblinTweaks.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions/upload-artifact@v5
        with:
          name: GoblinTweaks
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # actions/download-artifact@v5
        with:
          name: GoblinTweaks
          path: artifact

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # softprops/action-gh-release@v2
        with:
          name: GoblinTweaks ${{ github.ref_name }}
          generate_release_notes: true
          files: artifact/latest.zip

      - name: Update repo.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/update-repo-json.py artifact/GoblinTweaks.json "$REPO" "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "repo.json: $TAG" || echo "No changes"
          git push origin main
