name: Build

# Push / pull request: compile against the current Dalamud release.
# Tag "v*": also publish a GitHub release with latest.zip and refresh repo.json.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'repo.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.dalamud
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download Dalamud
        run: |
          curl -sSfL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          mkdir -p "$DALAMUD_HOME"
          unzip -q dalamud.zip -d "$DALAMUD_HOME"

      - name: Build
        run: dotnet build GoblinTweaks/GoblinTweaks.csproj -c Release

      - name: Collect package
        run: |
          zip=$(find GoblinTweaks/bin -name latest.zip | head -n 1)
          test -n "$zip" || { echo "latest.zip not found"; exit 1; }
          mkdir dist
          cp "$zip" dist/latest.zip
          cp "$(dirname "$zip")/GoblinTweaks.json" dist/GoblinTweaks.json

      - uses: actions/upload-artifact@v5
        with:
          name: GoblinTweaks
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v5
        with:
          name: GoblinTweaks
          path: artifact

      - uses: softprops/action-gh-release@v2
        with:
          name: GoblinTweaks ${{ github.ref_name }}
          generate_release_notes: true
          files: artifact/latest.zip

      - name: Update repo.json
        run: |
          python3 scripts/update-repo-json.py artifact/GoblinTweaks.json "${{ github.repository }}" "${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "repo.json: ${{ github.ref_name }}" || echo "No changes"
          git push origin main
